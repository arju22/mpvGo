name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read mpvGo version
        run: echo "VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Check tag matches version.properties
        run: |
          base="${VERSION_TAG#v}"; base="${base%%-*}"
          if [ "$base" != "$VERSION_NAME" ]; then
            echo "::error::Tag $VERSION_TAG does not match VERSION_NAME=$VERSION_NAME in version.properties"
            exit 1
          fi

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Sign APKs
        run: |
          set -e
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          
          APK_COUNT=$(find "$PREVIEW_DIR" -name "mpvGo-${{ env.VERSION_NAME }}-standard-*-preview-unsigned.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No unsigned preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm release.keystore
            exit 1
          fi
          
          find "$PREVIEW_DIR" -name "mpvGo-${{ env.VERSION_NAME }}-standard-*-preview-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"
          
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed_apk"
            rm "$apk"
          done
          
          rm release.keystore
          ls -lh "$PREVIEW_DIR"/mpvGo-${{ env.VERSION_NAME }}-standard-*-preview.apk

      - name: Copy built artifacts
        run: |
          set -e
          mkdir -p preview
          declare -a apks=("arm64-v8a")

          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/standard/preview/mpvGo-${{ env.VERSION_NAME }}-standard-${abi}-preview.apk"
            dest="preview/mpvGo-${{ env.VERSION_TAG }}.apk"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              sha=$(sha256sum "$dest" | awk '{ print $1 }')
              echo "apk-${abi}-sha256=$sha" >> $GITHUB_ENV
            fi
          done

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "mpvGo ${{ env.VERSION_TAG }}"
          body: |
            
            ### Checksums
            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk-arm64-v8a-sha256 }} |
          files: |
            preview/mpvGo-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
