name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '!v[0-9]+.[0-9]+.[0-9]+-preview.*'

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read mpvGo version
        run: echo "VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Get tag name
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Check tag matches version.properties
        run: |
          base="${VERSION_TAG#v}"; base="${base%%-*}"
          if [ "$base" != "$VERSION_NAME" ]; then
            echo "::error::Tag $VERSION_TAG does not match VERSION_NAME=$VERSION_NAME in version.properties"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # mpvGo ships only the standard flavor; playstore/fdroid stay defined but are not released.
      - name: Build standard release with Gradle
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Sign APK
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/apk/standard/release"
          unsigned="$RELEASE_DIR/mpvGo-${VERSION_NAME}-standard-arm64-v8a-release-unsigned.apk"
          if [ ! -f "$unsigned" ]; then
            echo "::error::Unsigned standard APK not found"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
          signed="mpvGo-${VERSION_TAG}.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$signed" \
            "$unsigned"
          rm release.keystore

          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$signed"
          echo "apk_sha256=$(sha256sum "$signed" | awk '{ print $1 }')" >> "$GITHUB_ENV"
          ls -lh "$signed"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION_NAME" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          {
            echo
            echo "---"
            echo "### Checksum"
            echo
            echo "| File | SHA-256 |"
            echo "| ---- | ------- |"
            echo "| mpvGo-${VERSION_TAG}.apk (arm64-v8a, Android 14+) | ${apk_sha256} |"
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvGo ${{ env.VERSION_TAG }}
          body_path: release-notes.md
          files: mpvGo-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
